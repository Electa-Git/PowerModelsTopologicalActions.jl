name: CI

on:
  push:
    branches:
      - main
    tags: ['*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        version:
          - '1.10'    # LTS / minimum supported
          - '1'       # latest stable
        os:
          - ubuntu-latest
        arch:
          - x64

    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}
      - uses: julia-actions/cache@v2
      - uses: julia-actions/julia-buildpkg@v1
      - name: Write Gurobi WLS license
        run: |
          cat > ${{ github.workspace }}/gurobi.lic <<EOF
          WLSACCESSID=${{ secrets.WLSACCESSID }}
          WLSSECRET=${{ secrets.WLSSECRET }}
          LICENSEID=${{ secrets.LICENSEID }}
          EOF
      - uses: julia-actions/julia-runtest@v1
        env:
          GRB_LICENSE_FILE: ${{ github.workspace }}/gurobi.lic
      - uses: julia-actions/julia-processcoverage@v1
      - uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false